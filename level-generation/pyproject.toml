[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "afterimage-levelgen"
version = "0.1.0"
description = "Photo albums to music and AFTERIMAGE rhythm charts"
requires-python = ">=3.11,<3.12"
dependencies = [
  "google-genai==1.56.0", "httpx==0.28.1", "pydantic==2.12.5",
  "Pillow==11.3.0", "numpy==2.2.6", "soundfile==0.13.1",
  "librosa==0.11.0", "torch==2.6.0", "torchaudio==2.6.0",
  "beat-this==1.1.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
afterimage-levelgen = "afterimage_levelgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
